project:
  name: heart-disease-risk-modelling-phase2
  seed: 42

data:
  archive: data/raw/heart+disease.zip
  missing_marker: "?"
  columns: [age, sex, cp, trestbps, chol, fbs, restecg, thalach, exang, oldpeak, slope, ca, thal, num]
  target_column: num
  positive_levels: [1, 2, 3, 4]
  cohorts:
    Cleveland: processed.cleveland.data
    Hungarian: processed.hungarian.data
    Switzerland: processed.switzerland.data
    VA: processed.va.data

cv:
  outer_folds: 5
  outer_repeats: 1
  inner_folds: 3
  stacking_folds: 3
  shuffle: true

features:
  continuous: [age, trestbps, chol, thalach, oldpeak]
  binary: [sex, fbs, exang]
  ordinal: [ca, slope]
  categorical: [cp, restecg, thal]
  discretization:
    n_bins: 3
    columns: [age, trestbps, chol, thalach, oldpeak]

models:
  bayesian_network:
    target_node: target
    prior: dirichlet
    pseudo_count: 2.0
    missing: error
  naive_bayes:
    alpha: 2.0
  logistic_regression:
    C: 1.0
  svm:
    C: 1.0
    gamma: scale
  random_forest:
    n_estimators: 200
    max_depth: 5
  gradient_boosting:
    learning_rate: 0.05
    n_estimators: 100
    max_depth: 2
  mlp:
    hidden_layout: "16-8"
    dropout: 0.3
    weight_decay: 0.001
    learning_rate: 0.001
    batch_size: 32
    max_epochs: 150
    patience: 15
    val_fraction: 0.2
  hybrid:
    bn_pseudo_count: 2.0
    meta_C: 1.0

search:
  method: optuna_tpe
  scoring: neg_log_loss
  n_trials: 12
  n_jobs: 1

evaluation:
  primary_threshold: 0.5
  calibration_bins: 10
  n_bootstrap: 500
  ci_level: 0.95

paths:
  root: results/phase2/main
  metrics: results/phase2/main/metrics
  figures: results/phase2/main/figures
  report: reports/phase2
